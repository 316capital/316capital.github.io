name: Deploy 316cap.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: 375b86370c27593f64e99539085cdfa6
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          tree = ET.parse("sitemap.xml")
          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in tree.findall("s:url/s:loc", namespace)]
          payload = json.dumps({
              "host": "316cap.com",
              "key": key,
              "keyLocation": f"https://316cap.com/{key}.txt",
              "urlList": urls,
          }).encode()
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 202):
                  raise RuntimeError(f"IndexNow returned HTTP {response.status}")
              print(f"IndexNow accepted {len(urls)} canonical URLs")
          PY
